<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Traffic Monitor - High Definition</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.20.0/dist/tf.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Montserrat', sans-serif; background: #0f172a; color: #f8fafc; display: flex; flex-direction: column; align-items: center; padding: 20px; margin: 0; }
        
        /* Ukuran Display diperbesar menjadi 1280x720 (HD) */
        .container { 
            position: relative; 
            border-radius: 16px; 
            overflow: hidden; 
            border: 5px solid #334155; 
            background: #000; 
            width: 1280px; 
            height: 720px; 
            box-shadow: 0 20px 50px rgba(0,0,0,0.7); 
        }

        video { display: block; width: 100%; height: 100%; object-fit: cover; }
        canvas#overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }

        /* Panel Statistik disesuaikan lebarnya */
        .stats-panel { 
            margin-top: 25px; 
            padding: 25px; 
            background: #1e293b; 
            border-radius: 16px; 
            width: 1280px; 
            box-sizing: border-box; 
            border: 1px solid #334155; 
        }

        .counter-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; }
        
        .counter-item { 
            background: #334155; 
            padding: 20px; 
            border-radius: 12px; 
            text-align: center; 
            border: 2px solid transparent; 
            transition: all 0.3s ease; 
        }
        
        .counter-item:hover { transform: translateY(-8px); border-color: #38bdf8; background: #1e293b; }
        .counter-item b { font-size: 42px; display: block; margin-top: 10px; color: #38bdf8; text-shadow: 0 0 10px rgba(56, 189, 248, 0.5); }
        
        .badge { padding: 8px 16px; border-radius: 8px; font-size: 14px; font-weight: bold; margin-bottom: 15px; display: inline-block; }
        .badge-wait { background: #f59e0b; color: white; }
        .badge-ready { background: #10b981; color: white; box-shadow: 0 0 15px rgba(16, 185, 129, 0.4); }
        
        h2 { margin-bottom: 15px; color: #f8fafc; text-transform: uppercase; letter-spacing: 4px; font-size: 28px; }
    </style>
</head>
<body>

    <h2>Traffic Vision Pro - HD Monitoring</h2>
    
    <div class="container">
        <video id="video" muted autoplay playsinline></video>
        <canvas id="overlay"></canvas>
    </div>

    <div class="stats-panel">
        <span id="status-ai" class="badge badge-wait">INITIALIZING AI...</span>
        <div class="counter-grid">
            <div class="counter-item">🚌 BUS<br><b id="count-bus">0</b></div>
            <div class="counter-item">🚗 MOBIL<br><b id="count-car">0</b></div>
            <div class="counter-item">🏍️ MOTOR<br><b id="count-motorcycle">0</b></div>
            <div class="counter-item">🚚 TRUK<br><b id="count-truck">0</b></div>
        </div>
    </div>

    <script>
        const video = document.getElementById('video');
        const overlay = document.getElementById('overlay');
        const ctx = overlay.getContext('2d');
        const statusBadge = document.getElementById('status-ai');

        let model = undefined;
        const MODEL_PATH = 'best_web_model/model.json'; 
        const STREAM_URL = 'https://livepantau.semarangkota.go.id/d8aa2edc-0a25-4508-933b-17ca47eba5be/video1_stream.m3u8';
        
        const LABELS = ['bus', 'car', 'motorcycle', 'truck']; 
        let totalCounts = { bus: 0, car: 0, motorcycle: 0, truck: 0 };
        let trackedObjects = [];

        async function init() {
            try {
                model = await tf.loadGraphModel(MODEL_PATH);
                const dummy = tf.zeros([1, 640, 640, 3]);
                model.execute(dummy);
                tf.dispose(dummy);

                statusBadge.innerText = "YOLOv8 SYSTEM ACTIVE";
                statusBadge.className = "badge badge-ready";
                detectFrame();
            } catch (e) {
                statusBadge.innerText = "MODEL ERROR";
                console.error(e);
            }
        }

        if (Hls.isSupported()) {
            const hls = new Hls();
            hls.loadSource(STREAM_URL);
            hls.attachMedia(video);
            hls.on(Hls.Events.MANIFEST_PARSED, () => video.play());
        }

        async function detectFrame() {
            if (model && video.readyState >= 2) {
                const [mWidth, mHeight] = [640, 640];
                const predictions = await tf.tidy(() => {
                    const img = tf.browser.fromPixels(video)
                        .resizeNearestNeighbor([mWidth, mHeight])
                        .toFloat()
                        .div(255.0)
                        .expandDims(0);
                    const result = model.execute(img);
                    return processOutput(result.arraySync()[0], 0.45);
                });
                renderAndCount(predictions);
            }
            requestAnimationFrame(detectFrame);
        }

        function processOutput(output, threshold) {
            let boxes = [];
            for (let i = 0; i < output[0].length; i++) {
                let classScores = [];
                for(let c = 4; c < output.length; c++) classScores.push(output[c][i]);
                const maxScore = Math.max(...classScores);
                if (maxScore > threshold) {
                    const classId = classScores.indexOf(maxScore);
                    const [cx, cy, w, h] = [output[0][i], output[1][i], output[2][i], output[3][i]];
                    boxes.push({ bbox: [cx - w/2, cy - h/2, w, h], class: LABELS[classId], score: maxScore });
                }
            }
            return boxes;
        }

        function renderAndCount(preds) {
            overlay.width = video.clientWidth;
            overlay.height = video.clientHeight;
            ctx.clearRect(0, 0, overlay.width, overlay.height);

            const lineY = overlay.height * 0.7; // Posisi garis geser sedikit ke bawah untuk akurasi
            const detectorRange = 45; // Jarak deteksi diperlebar karena layar lebih besar

            // Garis Deteksi Neon
            ctx.strokeStyle = "#38bdf8";
            ctx.shadowBlur = 10;
            ctx.shadowColor = "#38bdf8";
            ctx.lineWidth = 4;
            ctx.beginPath(); ctx.moveTo(0, lineY); ctx.lineTo(overlay.width, lineY); ctx.stroke();
            ctx.shadowBlur = 0; // Reset shadow

            const scaleX = overlay.width / 640;
            const scaleY = overlay.height / 640;

            preds.forEach(p => {
                const [x, y, w, h] = p.bbox;
                const [rx, ry, rw, rh] = [x * scaleX, y * scaleY, w * scaleX, h * scaleY];
                const [cX, cY] = [rx + (rw / 2), ry + (rh / 2)];

                // Bounding Box Neon
                ctx.strokeStyle = "#10b981";
                ctx.lineWidth = 3;
                ctx.strokeRect(rx, ry, rw, rh);

                // Label Text
                ctx.fillStyle = "#10b981";
                ctx.font = "bold 16px Montserrat";
                ctx.fillText(`${p.class.toUpperCase()}`, rx, ry - 10);

                // Dot Center
                ctx.fillStyle = "#fbbf24";
                ctx.beginPath(); ctx.arc(cX, cY, 6, 0, Math.PI * 2); ctx.fill();

                // Logic Crossing
                if (cY > (lineY - detectorRange) && cY < (lineY + detectorRange)) {
                    const isNew = !trackedObjects.some(old => 
                        Math.abs(old.x - cX) < 80 && old.label === p.class
                    );
                    if (isNew) {
                        totalCounts[p.class]++;
                        updateUI();
                        trackedObjects.push({ x: cX, label: p.class, time: Date.now() });
                    }
                }
            });
            trackedObjects = trackedObjects.filter(obj => Date.now() - obj.time < 1200);
        }

        function updateUI() {
            Object.keys(totalCounts).forEach(key => {
                document.getElementById(`count-${key}`).innerText = totalCounts[key];
            });
        }

        init();
    </script>
</body>
</html>
